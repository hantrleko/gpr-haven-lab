name: weekly

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Fetch
        id: fetch
        continue-on-error: true
        run: python fetch_data.py
      - name: Build and advance the sample pin
        if: steps.fetch.outcome == 'success'
        run: python build.py --asof auto
      - name: Rebuild from the last panel
        if: steps.fetch.outcome != 'success'
        run: python build.py --from-derived --degraded
      - name: Validate
        run: |
          python scripts/validate_payload.py
          python -m unittest tests.test_placebo_bootstrap tests.test_downside tests.test_conditional_lp tests.test_spec_curve tests.test_static_claim tests.test_haven_se
      - name: Open an issue and keep the previous release
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Weekly GPR lab build failed" --body "The scheduled build failed. The previous published files were left in place."
      - name: Commit the rebuilt site
        if: success()
        run: |
          git config user.name "gpr-haven-lab"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/sample_pin.json; then
            echo "sample pin unchanged"
          else
            python -c "from datetime import date; from pathlib import Path; Path('CHANGELOG.md').open('a', encoding='utf-8').write('\n## %s weekly\n\nSample pin moved. See data/sample_pin.json.\n' % date.today().isoformat())"
          fi
          git add data/sample_pin.json docs CHANGELOG.md events/registry.json replication output registry/forecasts.jsonl
          git diff --cached --quiet && exit 0
          git commit -m "weekly: rebuild the lab from the sample pin"
          git push
